<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行の重複削除・並べ替え｜無料テキスト整形ツール</title>
<meta name="description" content="テキストの重複行を削除し、並べ替えや空行除去、前後の空白取り除きができる無料Webツール。データはブラウザ内で処理され、外部に送信されません。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site"><a href="index.html">データ処理ツール集</a><span class="tag">CSV・Excel・JSON・テキストの整形をブラウザで</span></header>
<main>
<h1>行の重複削除・並べ替え</h1>
<p class="lead">1行ずつのテキストを整えます。処理はブラウザ内で行われ、データは外部に送信されません。</p>
<textarea id="in" placeholder="テキストを貼り付けてください（1行に1件）"></textarea>
<div class="row">
<label><input type="checkbox" id="dedupe" checked> 重複行を削除</label>
<label><input type="checkbox" id="noempty" checked> 空行を削除</label>
<label><input type="checkbox" id="trim"> 前後の空白を取り除く</label>
<label>並べ替え <select id="sort"><option value="none">しない</option><option value="asc">昇順</option><option value="desc">降順</option></select></label>
</div>
<div class="row"><button id="run">整形する</button><button id="dl" class="sub">結果を保存</button><span class="stat" id="stat"></span></div>
<div class="out" id="out"></div>
<div class="cta">
<b>データ収集そのものを頼みたい方へ</b>
<p class="note">Webサイトからのデータ収集を代行しています。取得できるかの確認とサンプル10件は無料です。</p>
<a href="https://coconala.com/services/4501486" rel="noopener">ココナラで相談する（無料確認つき）</a>
</div>
</main>
<footer class="site"><a href="index.html">ツール一覧へ</a></footer>
<script src="tools.js"></script>
<script>initLines();</script>
</body>
</html>
